name: CI

on:
  push:
  pull_request:

# A newer push to the same branch / PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests never open a real window or an audio device.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Create the virtualenv
        run: uv venv --python 3.12
      - name: Install the dev tools (ruff comes with the dev dependency group)
        run: uv pip install --group dev
      - name: ruff check
        run: .venv/bin/ruff check .
      - name: ruff format --check
        run: .venv/bin/ruff format --check .

  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Create the virtualenv
        run: uv venv --python ${{ matrix.python-version }}
      # First, and from the CPU index: the default Linux wheel drags in gigabytes of CUDA
      # libraries. The project install below then finds its torch requirement satisfied.
      - name: Install CPU-only torch
        run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install the project and the dev dependency group
        run: uv pip install -e . --group dev
      - name: Show versions
        run: .venv/bin/python -c "import sys, torch, gymnasium, numpy; print(sys.version); print('torch', torch.__version__, '| gymnasium', gymnasium.__version__, '| numpy', numpy.__version__)"
      # Not `uv run`: it would sync the env with uv.lock and replace the CPU-only torch.
      - name: pytest (fast suite)
        run: .venv/bin/python -m pytest -m "not slow"

  slow-tests:
    name: slow tests (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Create the virtualenv
        run: uv venv --python 3.12
      - name: Install CPU-only torch
        run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install the project and the dev dependency group
        run: uv pip install -e . --group dev
      # CartPole convergence (PPO, DQN), search-agent completability of 1-2 / 1-3, long fuzzing.
      - name: pytest (slow suite)
        run: .venv/bin/python -m pytest -m slow
