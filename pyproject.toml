[project]
name = "mario-play"
version = "0.1.0"
description = "An original Mario-style platformer, a Gymnasium env around it, and a from-scratch PyTorch RL framework (PPO + Double DQN)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Deep Meena" }]
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "torch>=2.2",
    "pygame-ce>=2.4",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "pillow>=10.0",
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]>=2.31"]

[project.scripts]
mario-play = "mario_play.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mario_play"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
timeout = 900
markers = [
    "slow: long-running tests (algorithm convergence, hard-level search); deselect with -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygame.*",
    "ignore:pkg_resources is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/mario_play/game/sprites.py" = ["E501"]
"src/mario_play/game/font.py" = ["E501"]
